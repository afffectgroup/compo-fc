<style>
/* Layout: terrain vertical à gauche, banc + stats à droite, sélection en fenêtre par-dessus. Thème sombre unique, assumé. */
:root{
  --bg:#0c1410; --panel:#132019; --panel-2:#1a2b22; --line:#2a3f33;
  --fg:#eef3ee; --muted:#93a89a; --accent:#7ee08a;
  --pitch-a:#1f5a33; --pitch-b:#1b5130; --chalk:rgba(255,255,255,.55);
  --gold-a:#f3dc8a; --gold-b:#b98f2c; --silver-a:#e4e8ec; --silver-b:#8d98a3; --bronze-a:#e2b28a; --bronze-b:#8a5a37;
  --card-ink:#1b1608; --warn:#ffb07a; --warn-bg:#2b1f14; --icon-a:#fbf6e6; --icon-b:#c9b27a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
.team-name{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);letter-spacing:.01em;text-transform:uppercase;
  background:transparent;border:0;border-bottom:2px solid transparent;padding:0;width:min(100%,520px)}
.team-name:hover,.team-name:focus{border-bottom-color:var(--line);outline:none}
.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#08210f;border-color:var(--accent)}
select.btn{padding-right:8px}

.teams{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 300px;padding-bottom:2px}
.tab{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--fg);border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#08210f}
.sync{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.sync.ok{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}

.pitch{position:relative;width:100%;max-width:560px;aspect-ratio:68/100;margin:0 auto;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 10%,var(--pitch-b) 10% 20%);border:1px solid var(--line)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:clamp(62px,16%,88px);background:none;border:0;padding:0;display:grid;justify-items:center;gap:3px}
.slot .nm{font-family:var(--display);font-weight:700;font-size:clamp(11px,2.4vw,14px);text-transform:uppercase;letter-spacing:.02em;
  background:rgba(8,16,11,.78);padding:1px 6px;border-radius:4px;max-width:120%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{width:100%;aspect-ratio:3/4;border:2px dashed var(--chalk);border-radius:10px;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;color:var(--fg);background:rgba(0,0,0,.18);font-size:15px}
.slot[data-player]{touch-action:manipulation;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.slot[data-player] .card{-webkit-user-select:none;user-select:none}
.slot.lifting .card{transform:scale(1.06);box-shadow:0 0 0 3px var(--accent),0 10px 24px rgba(0,0,0,.5);transition:transform .12s}
.ghost.touch{transform:translate(-50%,-115%) rotate(-3deg) scale(1.08)}
body.dragging-on{-webkit-user-select:none;user-select:none;cursor:grabbing}
.slot.dragging{opacity:.35}
.slot.drop-on .card,.slot.drop-on .empty{outline:3px solid var(--accent);outline-offset:2px}
.ghost{position:fixed;z-index:40;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.slot:hover .empty,.slot:hover .card{transform:translateY(-2px)}

.card{width:100%;aspect-ratio:3/4;border-radius:10px 10px 14px 14px;position:relative;color:var(--card-ink);overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .15s}
.card.gold{background:linear-gradient(160deg,var(--gold-a),var(--gold-b))}
.card.silver{background:linear-gradient(160deg,var(--silver-a),var(--silver-b))}
.card.bronze{background:linear-gradient(160deg,var(--bronze-a),var(--bronze-b))}
.card.icon{background:linear-gradient(160deg,var(--icon-a),var(--icon-b))}
.card{display:flex;flex-direction:column;padding:9% 9% 10%}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:4%}
.card .meta{display:flex;flex-direction:column;align-items:center;gap:2px}
.card .ovr{font-family:var(--display);font-weight:800;font-size:clamp(17px,4vw,26px);line-height:.95}
.card .ps{font-family:var(--display);font-weight:700;font-size:clamp(9px,2vw,12px);line-height:1;letter-spacing:.04em}
.card .flag{width:40%;flex:none}
.card .bottom{margin-top:auto;text-align:center;border-top:1px solid rgba(0,0,0,.22);padding-top:7%;min-width:0}
.card .pn{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(10px,2.3vw,14px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pc{font-size:clamp(7px,1.5vw,9px);line-height:1.2;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{display:block;width:100%;aspect-ratio:4/3;border-radius:2px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag-txt{font-family:var(--display);font-weight:700;font-size:clamp(8px,1.6vw,10px);line-height:1}
.iflag{display:inline-block;width:16px;height:12px;border-radius:2px;background-size:cover;vertical-align:-1px;margin-right:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.av svg,.mini svg{width:100%;height:100%;display:block;border-radius:50%}
.av{position:absolute;left:50%;transform:translateX(-50%);bottom:5%;width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(14px,3.2vw,20px);background-size:cover;background-position:center;
  border:2px solid rgba(255,255,255,.7)}
.bad{outline:2px solid #ff8a6b;outline-offset:1px}

aside{display:grid;gap:16px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h2{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lines{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:70px minmax(0,1fr) 28px;gap:10px;align-items:center}
.line .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.line b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .3s}
.fill.hi{background:var(--accent)} .fill.mid{background:var(--gold-b)} .fill.lo{background:var(--silver-b)}
@media (min-width:821px){aside{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.stat b{display:block;font-family:var(--display);font-size:clamp(26px,5vw,32px);line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.box-head h2{margin:0}
.btn.small{padding:5px 10px;font-size:13px}
.matchbox{display:grid;gap:14px}
.wrap>*,.view>*,.matchbox>*{min-width:0}
.view{display:grid;gap:20px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:-20px calc(-1*max(16px,env(safe-area-inset-right,0px))) 20px calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.appbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar-in .music{margin-right:auto;margin-left:14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em}
.brand span{color:var(--accent);margin-left:3px}
.views{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.views a{position:relative;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.views a.on{background:var(--fg);color:var(--bg)}
.views .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#e0735a}
@media (max-width:420px){.brand{font-size:18px}.views a{padding:7px 10px;font-size:13px}}
.btn.plain{background:transparent}
.btn.danger{color:#e0735a;border-color:transparent}
.btn.danger:hover{border-color:#e0735a}
.btn:hover{border-color:var(--accent)}
.teams{border-bottom:0;padding-bottom:0;flex-wrap:nowrap}
.teams .tabs{flex:1 1 auto}
#newTeam{flex:none}
.name-wrap{position:relative;display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 300px}
.name-wrap .team-name{flex:0 1 auto;min-width:0;width:auto;max-width:100%;field-sizing:content}
.pen{width:20px;height:20px;color:var(--muted);flex:none;opacity:.6}
.name-wrap:hover .pen{opacity:1;color:var(--accent)}
body.view-ai .pen{display:none}
.ai-banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px dashed var(--silver-b);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.ai-banner b{color:var(--fg)}
.ai-banner a{text-decoration:none;color:var(--fg)}
.lg-top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.lg-title{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);text-transform:uppercase;line-height:1}
.lg-top .note{margin:6px 0 0;font-size:14px}
.mine-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mine-card{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:14px;padding:16px;display:grid;gap:10px}
.mc-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.mc-name{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.mc-name:hover{color:var(--accent)}
.mc-rank b{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;color:var(--accent)}
.mc-rank span{font-family:var(--display);font-weight:700;font-size:16px;color:var(--accent);vertical-align:top}
.mc-sub{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.mc-row{display:flex;gap:10px;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.mc-row>span:not(.mc-lab):not(.mc-cd){flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:none;min-width:44px}
.mc-cd{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 8px;border-radius:999px}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-style:normal;font-size:12px;font-weight:700;color:#08210f;flex:none}
.res.rV{background:var(--accent)}.res.rN{background:var(--silver-b)}.res.rD{background:#e0735a}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.tlink{background:none;border:0;padding:0;color:var(--fg);font:inherit;font-weight:500;text-align:left;cursor:pointer}
.tlink:hover{color:var(--accent);text-decoration:underline}
.ai-card{display:grid;gap:4px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);min-width:0}
.ai-card:hover{border-color:var(--accent)}
.ai-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-top b{font-family:var(--display);font-size:17px;text-transform:uppercase;min-width:0}
.ai-ovr{font-family:var(--display);font-weight:800;font-size:22px;color:var(--gold-a)}
.ai-meta{font-size:12px;color:var(--muted)}
.ai-stars{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#leagueBox .seg{margin-bottom:4px}

.tab-sep{flex:none;align-self:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px 0 10px;border-left:1px solid var(--line);margin-left:6px}
.tab.ai{border-style:dashed}
.tab.ai.on{background:var(--silver-a);border-color:var(--silver-a);color:#16201a}
body.view-ai .slot{cursor:default}
body.view-ai .team-name{pointer-events:none}
.lg-seg{align-self:start}
.tbl-wrap{overflow-x:auto}
.lg-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.lg-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:6px 6px;border-bottom:1px solid var(--line)}
.lg-table td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.lg-table td.tn,.lg-table th:nth-child(2){text-align:left}
.lg-table td.tn{white-space:nowrap;font-weight:500}
.lg-table td.pts{font-family:var(--display);font-weight:800;font-size:17px}
.lg-table td.muted{color:var(--muted);font-size:13px}
.lg-table tr.mine td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.lg-table tr.mine td.tn{color:var(--accent);font-weight:700}
.lg-table .link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;margin-left:8px;padding:0}
.form{white-space:nowrap}.form i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-style:normal;font-size:10px;font-weight:700;margin:0 1px;color:#08210f}
.form .fV{background:var(--accent)}.form .fN{background:var(--silver-b)}.form .fD{background:#e0735a}
@media (max-width:560px){.hide-s{display:none}}
.champ{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold-a),var(--gold-b));color:var(--card-ink);border-radius:12px;padding:14px 16px}
.champ span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.champ b{font-family:var(--display);font-size:26px;text-transform:uppercase;flex:1 1 auto}
.rnav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rlab{display:grid;justify-items:center}.rlab b{font-family:var(--display);font-size:20px;text-transform:uppercase}.rlab span{font-size:12px;color:var(--muted)}
.rlist{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:8px;padding:10px 8px;font-size:14px}
.rrow:not(:disabled):hover,.rrow.on{background:var(--panel-2);border-color:var(--line)}
.rrow:disabled{cursor:default;opacity:.8}
.rrow .ht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ht:first-child{text-align:right}
.rrow b{font-family:var(--display);font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.rrow.mine .ht{color:var(--accent);font-weight:600}
.rdet{padding:6px 8px 12px;display:grid;gap:8px}
.cond{position:absolute;left:9%;right:9%;bottom:4%;height:3px;border-radius:2px;background:rgba(0,0,0,.18);overflow:hidden}
.cond i{display:block;height:100%}.cond i.ok{background:#2f9e55}.cond i.mid{background:#d39b1c}.cond i.low{background:#d2412f}
.fm{display:block;width:0;height:0;margin-top:2px;border-left:5px solid transparent;border-right:5px solid transparent}
.fm.up{border-bottom:7px solid #1f8a46}.fm.down{border-top:7px solid #c2372a}
.pg{display:block;font-family:var(--display);font-weight:800;font-size:clamp(8px,1.6vw,10px);line-height:1;margin-top:2px}
.pg.up{color:#1f7a3e}.pg.down{color:#b0362a}
.mc-lab.cup{color:var(--gold-a)}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;overflow-x:auto}
@media (max-width:640px){.bracket{grid-template-columns:repeat(3,minmax(170px,1fr))}}
.bcol{display:flex;flex-direction:column;gap:10px;justify-content:space-around;min-width:0}
.bcol h4{margin:0;font-family:var(--display);text-transform:uppercase;font-size:15px;letter-spacing:.04em}
.bcol .note{margin-top:-8px}

  order.forEach((slot,k)=>{const seq=k%2?[...teams].reverse():teams;
    seq.forEach(t=>{const role=FORMATIONS[t.formation][slot][0];t.xi[slot]=take(p=>p.pos.includes(role))||take(p=>fit(p,role)>0)})});
  for(let b=0;b<7;b++){const seq=b%2?[...teams].reverse():teams;seq.forEach(t=>{t.bench[b]=b===0?take(p=>p.pos.includes("GK")):take(p=>!p.pos.includes("GK"))})}

    allByDay().forEach(({d,m,c})=>{if((m.hId===team.id||m.aId===team.id)&&slotTime(d,c)<t0)tm.push({d,c})});

const TIER_COL={gold:["#f3dc8a","#b98f2c"],silver:["#e4e8ec","#8d98a3"],bronze:["#e2b28a","#8a5a37"],icon:["#fbf6e6","#c9b27a"]};
const imgCache={};
function loadImg(src){if(imgCache[src])return imgCache[src];return imgCache[src]=new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src})}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(ctx,t,max){if(ctx.measureText(t).width<=max)return t;while(t.length>1&&ctx.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…"}
async function drawCard(ctx,p,role,cx,cy,w,cap){
  const h=w*4/3,x=cx-w/2,y=cy-h/2,[a,b]=TIER_COL[tierOf(p)];
  ctx.save();ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=w*.12;ctx.shadowOffsetY=w*.04;
  const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;rr(ctx,x,y,w,h,w*.1);ctx.fill();ctx.restore();
  const pad=w*.09,ink="#1b1608";ctx.fillStyle=ink;ctx.textBaseline="alphabetic";ctx.textAlign="left";
  ctx.font=`800 ${w*.27}px "Barlow Condensed",sans-serif`;ctx.fillText(p.ovr,x+pad,y+pad+w*.24);
  ctx.font=`700 ${w*.12}px "Barlow Condensed",sans-serif`;ctx.fillText(POS_FR[role&&role!=="SUB"?role:p.pos[0]],x+pad+w*.02,y+pad+w*.39);
  const f=FLAGS[p.nat];if(f){const im=await loadImg(f);if(im){const fw=w*.36,fh=fw*.75;ctx.save();rr(ctx,x+w-pad-fw,y+pad,fw,fh,w*.025);ctx.clip();ctx.drawImage(im,x+w-pad-fw,y+pad,fw,fh);ctx.restore()}}
  if(cap){ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x+w-pad-w*.12,y+pad+w*.48,w*.11,0,7);ctx.fill();ctx.fillStyle=a;ctx.font=`800 ${w*.14}px "Barlow Condensed",sans-serif`;ctx.textAlign="center";ctx.fillText("C",x+w-pad-w*.12,y+pad+w*.53)}
  ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=Math.max(1,w*.008);ctx.beginPath();ctx.moveTo(x+pad,y+h*.66);ctx.lineTo(x+w-pad,y+h*.66);ctx.stroke();
  ctx.fillStyle=ink;ctx.textAlign="center";ctx.font=`800 ${w*.15}px "Barlow Condensed",sans-serif`;
  ctx.fillText(fitText(ctx,shortName(p.name).toUpperCase(),w-pad*2),cx,y+h*.81);
  ctx.globalAlpha=.75;ctx.font=`500 ${w*.09}px "Barlow",sans-serif`;ctx.fillText(fitText(ctx,p.club,w-pad*2),cx,y+h*.92);ctx.globalAlpha=1;
}
async function renderTeamImage(){
  try{await Promise.all([document.fonts.load('800 40px "Barlow Condensed"'),document.fonts.load('700 20px "Barlow Condensed"'),document.fonts.load('600 20px "Barlow Condensed"'),document.fonts.load('500 20px "Barlow"')])}catch(e){}
  const W=1080,H=1700,c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
  ctx.fillStyle="#0c1410";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#eef3ee";ctx.textAlign="left";ctx.font='800 64px "Barlow Condensed",sans-serif';ctx.fillText(fitText(ctx,(state.name||"Mon équipe").toUpperCase(),W-120),60,100);
  const xs=state.xi.filter(n=>n&&BY[n]).map(n=>BY[n]),all=[...state.xi,...state.bench].filter(n=>n&&BY[n]).map(n=>BY[n]);
  const avg=a=>a.length?Math.round(a.reduce((s,p)=>s+p.ovr,0)/a.length):"–";
  ctx.fillStyle="#93a89a";ctx.font='600 30px "Barlow Condensed",sans-serif';
  const ag=all.filter(p=>p.age>0);ctx.fillText(`${state.formation}   ·   NOTE EFFECTIF ${avg(all)}${ag.length?"   ·   ÂGE MOYEN "+(ag.reduce((s,p)=>s+p.age,0)/ag.length).toFixed(1):""}`,62,148);
  // pitch
  const px=60,py=180,pw=W-120,ph=1120;
  ctx.save();rr(ctx,px,py,pw,ph,24);ctx.clip();
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?"#1b5130":"#1f5a33";ctx.fillRect(px,py+i*ph/10,pw,ph/10)}

  const m=24;ctx.strokeRect(px+m,py+m,pw-2*m,ph-2*m);ctx.beginPath();ctx.moveTo(px+m,py+ph/2);ctx.lineTo(px+pw-m,py+ph/2);ctx.stroke();
  ctx.beginPath();ctx.arc(px+pw/2,py+ph/2,100,0,7);ctx.stroke();
  const bw=pw*.56,bh=ph*.15;ctx.strokeRect(px+(pw-bw)/2,py+m,bw,bh);ctx.strokeRect(px+(pw-bw)/2,py+ph-m-bh,bw,bh);

      ctx.fillStyle="#eef3ee";ctx.textAlign="center";ctx.font='700 30px "Barlow Condensed",sans-serif';ctx.fillText(POS_FR[role],cx,cy+10)}}
  // bench
  ctx.fillStyle="#93a89a";ctx.textAlign="left";ctx.font='700 30px "Barlow Condensed",sans-serif';ctx.fillText("REMPLAÇANTS",62,py+ph+64);
  const bn=state.bench.filter(n=>n&&BY[n]),bwc=124,gap=(pw-7*bwc)/6;
  for(let i=0;i<bn.length;i++)await drawCard(ctx,BY[bn[i]],"SUB",px+bwc/2+i*(bwc+gap),py+ph+92+bwc*2/3,bwc,false);

  return new Promise(res=>c.toBlob(res,"image/png"));
}

<script>

(function(){

  if(window.matchMedia&&matchMedia("(hover:hover)").matches){
    const tip=document.createElement("div");tip.className="tip";tip.setAttribute("role","tooltip");document.body.append(tip);let cur=null,timer=0;
    const show=elx=>{const txt=elx.dataset.tip;if(!txt){return}
      const parts=txt.split(" — ");tip.replaceChildren();
      if(parts.length>1){const b=document.createElement("b");b.textContent=parts[0];tip.append(b);parts.slice(1).join(" — ").split(" · ").forEach(s=>{const sp=document.createElement("span");sp.textContent=s;tip.append(sp)})}
      else tip.textContent=txt;
      const r=elx.getBoundingClientRect();tip.style.left="0px";tip.style.top="0px";tip.classList.add("on");
      const tw=tip.offsetWidth,th=tip.offsetHeight;let x=r.left+r.width/2-tw/2,y=r.top-th-8;if(y<70)y=r.bottom+8;

    document.addEventListener("mouseout",e=>{if(!cur)return;const to=e.relatedTarget;if(to&&cur.contains(to))return;cur=null;clearTimeout(timer);tip.classList.remove("on")});
    addEventListener("scroll",()=>{tip.classList.remove("on")},{passive:true});
    document.addEventListener("pointerdown",()=>{clearTimeout(timer);tip.classList.remove("on")});
  }
  document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const ov=document.getElementById("overlay");if(ov&&!ov.hidden&&typeof closePicker==="function"){closePicker();return}
    if(typeof spOpen!=="undefined"&&spOpen){spOpen=null;renderSetPieces()}});
